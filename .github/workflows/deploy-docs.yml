name: Deploy Next.js site to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_NAME: "event-mapping docs"
      NEXT_PUBLIC_SITE_URL: "https://shouta0715.github.io/event-mapping"
      VERCEL_ENV: "production"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Generate .env file
        run: |
          echo "NEXT_PUBLIC_SITE_NAME=$NEXT_PUBLIC_SITE_NAME" >> docs/.env
          echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" >> docs/.env
          echo "VERCEL_ENV=$VERCEL_ENV" >> docs/.env
      - name: Build with Next.js
        run: pnpm build --filter="./docs"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
